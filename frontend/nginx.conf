# frontend/nginx.conf
# Without try_files, refreshing any React Router page (e.g. /dashboard)
# would return a 404 because Nginx looks for a real file at that path.
# try_files $uri /index.html falls back to index.html so React Router takes over.
server {
  listen 80;
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri /index.html;
  }
}
